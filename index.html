<script>
        const btn = document.getElementById('record-toggle-btn');
        
        let audioContext;
        let analyser;
        let source;
        let stream;
        let animationId;
        let isRecording = false;

        const canvas = document.getElementById('pitchCanvas');
        const ctx = canvas.getContext('2d');
        let pitchHistory = [];
        
        let globalMinMidi = Infinity;
        let globalMaxMidi = -Infinity;
        
        const ranges = {
            t1: { name: 'Tenor 1', min: 52, max: 69, collected: new Set() },
            t2: { name: 'Tenor 2', min: 48, max: 65, collected: new Set() },
            b1: { name: 'Bass 1', min: 45, max: 62, collected: new Set() },
            b2: { name: 'Bass 2', min: 38, max: 59, collected: new Set() } // D2 is 38
        };
        
        const minFreqLog = Math.log2(65.4);
        const maxFreqLog = Math.log2(523.25);
        const freqRangeLog = maxFreqLog - minFreqLog;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function freqToMidi(freq) {
            return Math.round(12 * Math.log2(freq / 440)) + 69;
        }

        async function startRecording() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                isRecording = true;
                pitchHistory = [];
                globalMinMidi = Infinity;
                globalMaxMidi = -Infinity;
                resetBars();
                
                ['t1', 't2', 'b1', 'b2'].forEach(id => {
                    document.getElementById(`container-${id}`).classList.remove('winner-flash');
                });
                
                btn.classList.remove('bg-[#0ea5e9]', 'hover:bg-[#0284c7]');
                btn.classList.add('bg-error', 'text-on-error');
                btn.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h12v12H6z"/></svg> Aufnahme stoppen`;

                draw();

            } catch (err) {
                console.error("Microphone access denied or error: ", err);
                alert("Bitte erlaube den Mikrofonzugriff, um den Stimmencheck zu starten.");
            }
        }

        function stopRecording() {
            isRecording = false;
            cancelAnimationFrame(animationId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            btn.classList.remove('bg-error', 'text-on-error');
            btn.classList.add('bg-[#0ea5e9]', 'hover:bg-[#0284c7]');
            btn.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg> Aufnahme starten`;
            
            showSummary();
        }
        
        function resetBars() {
            ['t1', 't2', 'b1', 'b2'].forEach(id => {
                ranges[id].collected.clear();
                document.getElementById(`bar-${id}`).style.width = '0%';
                document.getElementById(`label-${id}`).classList.remove('font-bold', 'text-primary');
            });
        }
        
        window.updateVoiceBars = function(freq) {
            if (freq < 50) {
                return;
            }
            
            const midiNote = freqToMidi(freq);
            
            ['t1', 't2', 'b1', 'b2'].forEach(id => {
                const range = ranges[id];
                const bar = document.getElementById(`bar-${id}`);
                const label = document.getElementById(`label-${id}`);
                
                if (midiNote >= range.min && midiNote <= range.max) {
                    range.collected.add(midiNote);
                }
                
                const totalNotes = range.max - range.min + 1;
                const percentage = (range.collected.size / totalNotes) * 100;
                
                bar.style.width = `${percentage}%`;
                if(percentage > 0) {
                    label.classList.add('font-bold');
                }
                if(percentage > 50) {
                     label.classList.add('text-primary');
                }
            });
        }
        
        function showSummary() {
            let maxPercentage = -1;
            let winnerId = null;
            
            ['t1', 't2', 'b1', 'b2'].forEach(id => {
                const range = ranges[id];
                const totalNotes = range.max - range.min + 1;
                const percentage = Math.round((range.collected.size / totalNotes) * 100);
                if (percentage > maxPercentage) {
                    maxPercentage = percentage;
                    winnerId = id;
                }
            });
            
            if (winnerId && maxPercentage > 0) {
                document.getElementById(`container-${winnerId}`).classList.add('winner-flash');
            }
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;
            
            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++)
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++)
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (d < SIZE - 1 && c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            if (T0 <= 0 || T0 >= SIZE - 1) return -1;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function draw() {
            if (!isRecording) return;
            animationId = requestAnimationFrame(draw);

            const bufferLength = analyser.fftSize;
            const dataArray = new Float32Array(bufferLength);
            analyser.getFloatTimeDomainData(dataArray);

            let pitch = autoCorrelate(dataArray, audioContext.sampleRate);
            
            let y = canvas.height;
            
            if (pitch !== -1 && pitch > 50 && pitch < 1000) {
                 const midiNote = freqToMidi(pitch);
                 if (midiNote < globalMinMidi) globalMinMidi = midiNote;
                 if (midiNote > globalMaxMidi) globalMaxMidi = midiNote;
                 
                 const pLog = Math.log2(pitch);
                 const normalizedY = (pLog - minFreqLog) / freqRangeLog;
                 y = canvas.height - (Math.max(0, Math.min(1, normalizedY)) * canvas.height);
                 
                 // Note: updateVoiceBars is wrapped below to handle the 0.05s tolerance
                 window.handlePitchDetection(pitch);
            }

            pitchHistory.push(y);
            if(pitchHistory.length > canvas.width) {
                pitchHistory.shift();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (globalMinMidi !== Infinity && globalMaxMidi !== -Infinity) {
                const minF = 440 * Math.pow(2, (globalMinMidi - 69) / 12);
                const maxF = 440 * Math.pow(2, (globalMaxMidi - 69) / 12);
                
                const minLog = Math.log2(Math.max(65.4, minF));
                const maxLog = Math.log2(Math.min(523.25, maxF));
                
                const normMinY = (minLog - minFreqLog) / freqRangeLog;
                const normMaxY = (maxLog - minFreqLog) / freqRangeLog;
                
                const yBottom = canvas.height - (Math.max(0, Math.min(1, normMinY)) * canvas.height);
                const yTop = canvas.height - (Math.max(0, Math.min(1, normMaxY)) * canvas.height);
                
                ctx.fillStyle = 'rgba(45, 212, 191, 0.15)';
                ctx.fillRect(0, yTop, canvas.width, yBottom - yTop);
                
                ctx.strokeStyle = 'rgba(45, 212, 191, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, yTop);
                ctx.lineTo(canvas.width, yTop);
                ctx.moveTo(0, yBottom);
                ctx.lineTo(canvas.width, yBottom);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.strokeStyle = '#2dd4bf';
            ctx.lineWidth = 3;
            
            let hasValidPoints = false;
            for(let i=0; i<pitchHistory.length; i++) {
                if(pitchHistory[i] < canvas.height) {
                    if(!hasValidPoints) {
                        ctx.moveTo(i, pitchHistory[i]);
                        hasValidPoints = true;
                    } else {
                        ctx.lineTo(i, pitchHistory[i]);
                    }
                } else {
                    hasValidPoints = false;
                }
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(45, 212, 191, 0.2)';
            ctx.lineWidth = 8;
            hasValidPoints = false;
            for(let i=0; i<pitchHistory.length; i++) {
                if(pitchHistory[i] < canvas.height) {
                    if(!hasValidPoints) {
                        ctx.moveTo(i, pitchHistory[i]);
                        hasValidPoints = true;
                    } else {
                        ctx.lineTo(i, pitchHistory[i]);
                    }
                } else {
                    hasValidPoints = false;
                }
            }
            ctx.stroke();
        }

        btn.addEventListener('click', async () => {
            if (!isRecording) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                await startRecording();
            } else {
                stopRecording();
            }
        });
        
        let lastMidi = -1;
        let detectionStartTime = 0;
        
        window.handlePitchDetection = function(freq) {
            if (freq < 50) {
                lastMidi = -1;
                return;
            }
            
            const midiNote = freqToMidi(freq);
            const now = performance.now();

            if (midiNote === lastMidi) {
                if (now - detectionStartTime >= 50) {
                    window.updateVoiceBars(freq);
                }
            } else {
                lastMidi = midiNote;
                detectionStartTime = now;
            }
        };

<script>const originalUpdateVoiceBars = window.updateVoiceBars; window.updateVoiceBars = function(freq) { if (freq < 50) return; const midiNote = freqToMidi(freq); ['t1', 't2', 'b1', 'b2'].forEach(id => { const range = ranges[id]; const bar = document.getElementById(`bar-${id}`); const label = document.getElementById(`label-${id}`); const pctSpan = document.getElementById(`pct-${id}`); if (midiNote >= range.min && midiNote <= range.max) { range.collected.add(midiNote); } const totalNotes = range.max - range.min + 1; const percentage = Math.round((range.collected.size / totalNotes) * 100); bar.style.width = `${percentage}%`; if (pctSpan) pctSpan.textContent = `(${percentage}%)`; if (percentage > 0) label.classList.add('font-bold'); if (percentage > 50) label.classList.add('text-primary'); }); }; const originalResetBars = window.resetBars; window.resetBars = function() { ['t1', 't2', 'b1', 'b2'].forEach(id => { ranges[id].collected.clear(); document.getElementById(`bar-${id}`).style.width = '0%'; const pctSpan = document.getElementById(`pct-${id}`); if (pctSpan) pctSpan.textContent = '(0%)'; document.getElementById(`label-${id}`).classList.remove('font-bold', 'text-primary'); }); };</script></body></html>
